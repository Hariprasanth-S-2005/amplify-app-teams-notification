name: Validate PR Title 2.0

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Format
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"

          echo "Validating PR title:"
          echo "$TITLE"

          REGEX='^.+ - Release Card ID: R[0-9]+$'

          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::PR title must follow the format: 'Release Card ID: R<number>'"
            echo "::error::Example: Release Card ID: R12345"
            exit 1
          fi

          echo "✅ PR title validation passed"
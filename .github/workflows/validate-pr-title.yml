name: Validate PR Title

on:
  pull_request:
    branches:
      - main
      - abc
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Format
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"
          BRANCH="${{ github.head_ref }}"

          echo "PR Branch: $BRANCH"
          echo "PR Title: $TITLE"

          # Convert branch name to lowercase for case-insensitive matching
          BRANCH_LOWER="${BRANCH,,}"

          # Skip title validation for hotfix branches
          if [[ "$BRANCH_LOWER" =~ ^hotfix(/|-) ]]; then
            echo "✅ Hotfix branch detected. Skipping PR title validation."
            exit 0
          fi

          # Required format:
          # <description> - Release Card ID: R12345
          REGEX='^.+R[0-9]+$'

          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo "::error::PR title must follow the format: '<description> - Release Card ID: R<number>'"
            echo "::error::Example: Fix login issue - Release Card ID: R12345"
            exit 1
          fi

          echo "✅ PR title validation passed"
- name: Validate PR Title Format
  shell: bash
  run: |
    set -euo pipefail

    TITLE="${{ github.event.pull_request.title }}"
    BRANCH="${{ github.head_ref }}"

    echo "PR Branch: $BRANCH"
    echo "PR Title: $TITLE"

    # Enable case-insensitive regex matching
    shopt -s nocasematch

    # Skip validation for any hotfix branch
    if [[ "$BRANCH" =~ ^hotfix(/|-) ]]; then
      echo "✅ Hotfix branch detected. Skipping PR title validation."
      exit 0
    fi

    REGEX='^.+ - Release Card ID: R[0-9]+$'

    if [[ ! "$TITLE" =~ $REGEX ]]; then
      echo "::error::PR title must follow the format: '<description> - Release Card ID: R<number>'"
      echo "::error::Example: Fix login issue - Release Card ID: R12345"
      exit 1
    fi

    echo "✅ PR title validation passed"